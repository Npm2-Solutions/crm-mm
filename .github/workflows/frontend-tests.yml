name: Frontend

# Not on every pull request: NPM2 runs the checks when they are needed
# (05/10/2026, a pull request waited eleven minutes on them). Every night on
# develop, and by hand from Actions > Run workflow, on develop or on a branch.
on:
    schedule:
        # every night at midnight UTC
        - cron: "0 0 * * *"
    workflow_dispatch:

concurrency:
    group: frontend-${{ github.event.number || github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: yarn
                  cache-dependency-path: frontend/yarn.lock

            - name: Install dependencies
              run: cd frontend && yarn install --frozen-lockfile

            - name: ESLint
              run: cd frontend && npx eslint src --ext .js,.ts,.vue

            - name: Oxlint
              run: cd frontend && npx oxlint src

    build:
        name: Production Build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: yarn
                  cache-dependency-path: frontend/yarn.lock

            - name: Install dependencies
              run: cd frontend && yarn install --frozen-lockfile

            - name: Build frontend
              run: cd frontend && yarn build

    test:
        name: Unit Tests & Coverage
        runs-on: ubuntu-latest
        needs: lint

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: yarn
                  cache-dependency-path: frontend/yarn.lock

            - name: Run frontend tests
              uses: ./.github/actions/frontend-tests
              with:
                  node-version: "24"
                  enable-coverage: "true"

            - name: Upload coverage artifact
              if: github.base_ref == 'develop' || github.ref_name == 'develop'
              uses: ./.github/actions/upload-coverage
              with:
                  artifact-name: coverage-frontend
                  coverage-path: frontend/coverage/lcov.info

    coverage:
        name: Coverage Wrap Up
        needs: test
        if: github.base_ref == 'develop' || github.ref_name == 'develop'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Download artifacts
              uses: actions/download-artifact@v4

            - name: Publish coverage to Codecov
              uses: ./.github/actions/publish-codecov
              with:
                  name: Frontend
                  token: ${{ secrets.CODECOV_TOKEN }}

name: Sito

# Not on every pull request: NPM2 runs the checks when they are needed
# (05/10/2026, a pull request waited eleven minutes on them). By hand from
# Actions > Run workflow, on the branch to try.
# Publishing the site runs these tests first anyway (`sito-pubblica.yml`).
on:
    workflow_dispatch:

concurrency:
    group: sito-${{ github.event.number || github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Build and test
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"

            # the demo form's tests run it under `php -S`
            - name: PHP
              run: php --version

            - name: Test
              run: |
                  for sito in siti/*/; do
                      node --test "$sito"test/*.test.mjs
                  done

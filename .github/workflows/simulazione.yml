name: Simulazione di una settimana

# A real centre's week, played by its staff and patients through the real screens
# on a fresh test bench (e2e/simulazione/README.md). By hand only, from Actions >
# Run workflow, on develop or on a branch, before a release that changes what
# people do every day. Its report is the run's artifact.
on:
  workflow_dispatch:

concurrency:
  group: simulazione-crm-${{ github.ref }}
  cancel-in-progress: true

env:
  FRAPPE_BRANCH: develop
  SITE: collaudo.test

jobs:
  simulazione:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    name: Una settimana del centro

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true

      - name: Add to Hosts
        run: echo "127.0.0.1 ${SITE}" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install -y mariadb-client wkhtmltopdf

      - name: Setup Bench
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch "$FRAPPE_BRANCH" --python "$(which python)" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install CRM
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app crm $GITHUB_WORKSPACE
          # --dev: freezegun, which moves the bench's clock through the week
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin ${SITE}
          bench --site ${SITE} install-app crm
          bench build --app crm
        env:
          CI: "Yes"

      - name: Make the site a test bench
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site ${SITE} set-config dottorcloud_collaudo 1
          bench --site ${SITE} set-config allow_tests true
          bench --site ${SITE} set-config mute_emails 1
          bench --site ${SITE} set-config host_name "http://${SITE}:8000"
          bench --site ${SITE} set-config dottorcloud_collaudo_finti "http://127.0.0.1:8791"

      - name: Start the fake services
        run: |
          mkdir -p e2e/simulazione/rapporto
          nohup python3 e2e/simulazione/finti/server.py --porta 8791 --stato e2e/simulazione/rapporto/finti.json > e2e/simulazione/rapporto/finti.log 2>&1 &
          timeout 30 bash -c 'until curl -s http://127.0.0.1:8791/ > /dev/null; do sleep 1; done'

      - name: Start Frappe Server
        working-directory: /home/runner/frappe-bench
        run: |
          sed -i 's/^watch:/# watch:/g' Procfile
          # the scheduler stays still: the simulation runs each job at the hour it wants
          sed -i 's/^schedule:/# schedule:/g' Procfile
          bench start &> bench_start.log &
          timeout 90 bash -c "until curl -s http://${SITE}:8000/api/method/ping > /dev/null; do sleep 2; done"

      - name: Prepare the centre
        working-directory: /home/runner/frappe-bench
        run: bench --site ${SITE} execute crm.collaudo.prepara.centro

      - name: Install Playwright
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Play the week
        run: npx playwright test -c e2e/simulazione/playwright.config.ts
        env:
          SIM_BASE: http://${{ env.SITE }}:8000
          SIM_FINTI: http://127.0.0.1:8791
          SIM_ADMIN: Administrator
          SIM_ADMIN_PASSWORD: admin

      - name: Upload the report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulazione-rapporto
          path: e2e/simulazione/rapporto/
          retention-days: 14

      - name: Show Bench Logs on Failure
        if: failure()
        working-directory: /home/runner/frappe-bench
        run: |
          cat bench_start.log || true
          cat logs/*.log || true

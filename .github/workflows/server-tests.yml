name: Server

on:
    pull_request:
        paths-ignore:
            - "**.css"
            - "**.js"
            - "**.md"
            - "**.html"
            - "**.csv"
            - "**.po"
            - "**.pot"
    schedule:
        # Run everday at midnight UTC / 5:30 IST
        - cron: "0 0 * * *"
    workflow_dispatch:

concurrency:
    # keyed on the ref, not the pull request number: started by hand there is no
    # number, so every manual run shared one group and cancelled the one before it
    group: server-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Tests (frappe ${{ matrix.frappe-branch }})
        runs-on: ubuntu-latest
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                # what we actually run. pyproject pins frappe to >=16.0.0-dev,<17.0.0,
                # so a bench on anything else would refuse to install this app in the
                # first place — testing against it proves nothing about what we ship.
                frappe-branch: ["version-16"]

        services:
            mysql:
                image: mariadb:10.6
                env:
                    MYSQL_ROOT_PASSWORD: root
                ports:
                    - 3306:3306
                options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=3

        steps:
            - name: Clone
              uses: actions/checkout@v6

            - name: Setup environment
              uses: ./.github/actions/setup-server-env
              with:
                  python-version: "3.14"
                  node-version: "24"
                  type: "server"
                  # never installed on frappe 16: its test bootstrap does not survive a
                  # bare bench. The erpnext integration is covered by its own tests.
                  install-erpnext: false
                  frappe-branch: ${{ matrix.frappe-branch }}

            - name: Run server tests
              uses: ./.github/actions/run-server-tests
              with:
                  bench-path: "/home/runner/frappe-bench"
                  site: "test_site"
                  app: "crm"
                  enable-coverage: "true"
                  type: "server"
                  ci-build-id: ${{ github.run_id }}

            - name: Persist coverage artifact
              if: github.base_ref == 'develop' || github.ref_name == 'develop'
              uses: ./.github/actions/upload-coverage
              with:
                  artifact-name: coverage-${{ matrix.frappe-branch }}
                  coverage-path: /home/runner/frappe-bench/sites/coverage.xml

    coverage:
        name: Coverage Wrap Up
        needs: test
        if: github.base_ref == 'develop' || github.ref_name == 'develop'
        runs-on: ubuntu-latest
        steps:
            - name: Clone
              uses: actions/checkout@v6

            - name: Download artifacts
              uses: actions/download-artifact@v4

            - name: Publish coverage
              uses: ./.github/actions/publish-codecov
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}

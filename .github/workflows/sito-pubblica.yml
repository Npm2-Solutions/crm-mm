name: Pubblica il sito

# Publishes sito/ on NPM2's HestiaCP server, as Worgify's site does: a push to
# develop that changes the site puts it online. It uses a key made only for
# this, authorised on the panel user that owns the site: no root, no Hetzner
# token (that one manages the machine, and could delete it). Repository
# secrets (Settings → Secrets and variables → Actions):
#
#   SSH_HOST     the server (91.99.201.178)
#   SSH_USER     the panel user that owns the site (dottorcloud)
#   SSH_KEY      the private half of the dottorcloud-actions-deploy key
#   DEPLOY_PATH  the site's folder (/home/dottorcloud/web/dottorcloud.it/public_html)
#   SSH_PORT     optional, 22 when missing
#
# Adding the domain, its certificate and nginx's settings stay in the panel
# (or sito/deploy.sh --crea --nginx as root): see sito/README.md.

on:
    push:
        branches: [develop]
        paths:
            - "sito/**"
            - "brand/**"
            - ".github/workflows/sito-pubblica.yml"
    workflow_dispatch:

# one publication at a time, never stopped half-way
concurrency:
    group: sito-pubblica
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    publish:
        name: Publish
        runs-on: ubuntu-latest
        env:
            SSH_HOST: ${{ secrets.SSH_HOST }}
            SSH_USER: ${{ secrets.SSH_USER }}
            SSH_PORT: ${{ secrets.SSH_PORT }}
            DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"

            # pages, links, images, no prices, the form: a site that fails them does not go online
            - name: Test
              run: node --test sito/test/sito.test.mjs

            # --delete empties whatever folder it is given, and the server holds other
            # sites: only a web domain's public_html, of the user the key belongs to
            - name: Where
              id: where
              env:
                  SSH_KEY: ${{ secrets.SSH_KEY }}
              run: |
                  for secret in SSH_HOST SSH_USER SSH_KEY DEPLOY_PATH; do
                      if [[ -z "${!secret}" ]]; then
                          echo "::error::The $secret secret is missing (see sito/README.md)."
                          exit 1
                      fi
                  done
                  path="${DEPLOY_PATH%/}"
                  if [[ ! "$path" =~ ^/home/([a-z0-9][a-z0-9_.-]*)/web/([a-z0-9][a-z0-9.-]*\.[a-z]+)/public_html$ ]]; then
                      echo "::error::DEPLOY_PATH is not /home/<user>/web/<domain>/public_html: not publishing there."
                      exit 1
                  fi
                  user="${BASH_REMATCH[1]}" domain="${BASH_REMATCH[2]}"
                  if [[ "$user" == root || "$user" == admin || "$user" != "$SSH_USER" ]]; then
                      echo "::error::DEPLOY_PATH belongs to $user, the key to $SSH_USER: the site needs a panel user of its own."
                      exit 1
                  fi
                  echo "user=$user" >> "$GITHUB_OUTPUT"
                  echo "domain=$domain" >> "$GITHUB_OUTPUT"
                  echo "Publishing https://$domain/ as $user."

            - name: SSH key
              env:
                  SSH_KEY: ${{ secrets.SSH_KEY }}
              run: |
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  # the server's fingerprint, so the copy talks to that server and no other
                  ssh-keyscan -T 20 -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
                  echo "StrictHostKeyChecking yes" >> ~/.ssh/config

            # builds for the domain, checks the folder holds only this site (or the panel's
            # page), copies dist/ with rsync --delete, then the 404 and the form's settings
            - name: Publish
              run: sito/deploy.sh "${{ steps.where.outputs.domain }}"
              env:
                  SITO_SSH: ${{ steps.where.outputs.user }}@${{ secrets.SSH_HOST }}
                  SITO_SSH_KEY: /home/runner/.ssh/deploy_key
                  SITO_SSH_PORT: ${{ secrets.SSH_PORT }}

            - name: Check
              run: |
                  domain="${{ steps.where.outputs.domain }}"
                  server="$(getent ahostsv4 "$SSH_HOST" | awk 'NR == 1 {print $1}')"
                  if [[ "$(getent ahostsv4 "$domain" | awk 'NR == 1 {print $1}')" == "$server" ]]; then
                      url="https://$domain/"
                      code="$(curl -sS -o /dev/null -w '%{http_code}' "$url" || true)"
                  else
                      # the DNS still points elsewhere: ask the server directly
                      url="http://$domain/ (DNS not on the server yet)"
                      code="$(curl -sS -o /dev/null -w '%{http_code}' --resolve "$domain:80:$server" "http://$domain/" || true)"
                  fi
                  echo "$url → $code"
                  echo "| $url | $code |" >> "$GITHUB_STEP_SUMMARY"
                  [[ "$code" == 200 ]]

            - name: Forget the key
              if: always()
              run: rm -f ~/.ssh/deploy_key

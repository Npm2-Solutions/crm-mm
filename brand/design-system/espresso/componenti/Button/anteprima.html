<!doctype html>

<html data-theme="light">
<script>if(location.hash==="#dark")document.documentElement.dataset.theme="dark"</script><head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../componenti.css"><style>html,body{margin:0;background:var(--surface-base);}.stage{padding:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;}.col{display:flex;flex-direction:column;gap:12px;}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}[data-theme="dark"] .only-light{display:none}:root:not([data-theme="dark"]) .only-dark{display:none}</style></head><body>
<div class="dc stage col" style="align-items:flex-start">
 <div class="row">

  <button class="dc-btn dc-btn--ghost dc-btn--md">Annulla</button>
  <button class="dc-btn dc-btn--danger dc-btn--md">Elimina</button>
 </div>
 <div class="row">
  <button class="dc-btn dc-btn--solid dc-btn--lg">Prenota la visita</button>
  <button class="dc-btn dc-btn--solid">Salva</button>

 </div>
</div>

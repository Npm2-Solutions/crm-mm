<!doctype html>
<html class="h-full" lang="{{ boot.lang }}">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>{{ title }}</title>
    <!-- the product's brand - the vertical's (crm.marchio): icons, colour, the
         phone's home screen; the centre's name is in the title beside it -->
    <link rel="icon" href="{{ marchio.favicon }}" />
    <link rel="apple-touch-icon" href="{{ marchio.touch_icon }}" />
    <link rel="manifest" href="/api/method/crm.marchio.manifest?app=area" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-title" content="{{ marchio.name }}" />
  </head>
  <body class="h-full bg-surface-gray-1">
    <div id="app" class="h-full"></div>
    <script>
      window.AREA = {{ boot | tojson }};
      window.csrf_token = {{ csrf_token | tojson }};
    </script>
    <script type="module" src="/src/area/main.js"></script>
  </body>
</html>

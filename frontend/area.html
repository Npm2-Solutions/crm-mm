<!doctype html>
<html class="h-full" lang="{{ boot.lang }}">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>{{ title }}</title>
    {% if branding.favicon %}
    <link rel="icon" href="{{ branding.favicon }}" />
    {% endif %}
  </head>
  <body class="h-full bg-surface-gray-1">
    <div id="app" class="h-full"></div>
    <script>
      window.AREA = {{ boot | tojson }};
      window.csrf_token = {{ csrf_token | tojson }};
    </script>
    <script type="module" src="/src/area/main.js"></script>
  </body>
</html>

<section class="section section--night" aria-labelledby="cta-titolo">
  <i class="closing__mint" aria-hidden="true"></i>
  <div class="container closing reveal">
    <img src="/img/marchio.svg" alt="" />
    <h2 id="cta-titolo" class="h2">Vediamolo sul tuo centro.</h2>
    <p class="lead">Una demo con i tuoi servizi, le tue agende e il tuo modo di lavorare.</p>
    <div class="buttons buttons--center">
      <a class="button button--mint" href="/demo/">Richiedi una demo {{icon arrow-right}}</a>
      <a class="button button--ghost" href="mailto:{{email}}">{{icon mail}} {{email}}</a>
    </div>
  </div>
</section>

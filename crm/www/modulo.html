<!doctype html>
<html lang="{{ boot.lang }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    {% if branding.favicon %}<link rel="icon" href="{{ branding.favicon }}" />{% endif %}
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <style>
      :root {
        --ink-strong: oklch(0.168 0 0);
        --ink: oklch(0.205 0 0);
        --muted: oklch(0.52 0 0);
        --faint: oklch(0.683 0 0);
        --border: oklch(0.913 0 0);
        --border-focus: oklch(0.8 0 0);
        --bg: oklch(0.975 0 0);
        --card: oklch(1 0 0);
        --field: oklch(0.975 0 0);
        --hover: oklch(0.96 0 0);
        --accent: oklch(0.205 0 0);
        --accent-ink: oklch(1 0 0);
        --accent-soft: oklch(0.94 0 0);
        --danger: oklch(0.507 0.165 25.286);
        --danger-bg: oklch(0.978 0.011 17.34);
        --success-bg: oklch(0.965 0.03 155.987);
        --success-ink: oklch(0.45 0.118 155.358);
        --radius: 12px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink-strong: oklch(0.98 0 0);
          --ink: oklch(0.92 0 0);
          --muted: oklch(0.72 0 0);
          --faint: oklch(0.55 0 0);
          --border: oklch(0.3 0 0);
          --border-focus: oklch(0.45 0 0);
          --bg: oklch(0.17 0 0);
          --card: oklch(0.21 0 0);
          --field: oklch(0.25 0 0);
          --hover: oklch(0.26 0 0);
          --accent: oklch(0.95 0 0);
          --accent-ink: oklch(0.18 0 0);
          --accent-soft: oklch(0.3 0 0);
          --danger-bg: oklch(0.3 0.06 25);
          --danger: oklch(0.8 0.1 25);
          --success-bg: oklch(0.3 0.05 155);
          --success-ink: oklch(0.85 0.1 155);
        }
      }
      {% if branding.css %}
      :root { {% for k, v in branding.css.items() %}{{ k }}: {{ v }}; {% endfor %} }
      {% endif %}
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
        background: var(--bg); color: var(--ink); min-height: 100vh; -webkit-font-smoothing: antialiased;
      }
      .shell { max-width: 680px; margin: 0 auto; padding: 1.75rem 1rem 6rem; }
      .brand { display: flex; align-items: center; gap: .6rem; color: var(--muted); font-size: .9rem; margin-bottom: 1rem; }
      .brand img { max-height: 32px; max-width: 140px; }
      h1 { font-size: 1.45rem; margin: 0 0 .35rem; color: var(--ink-strong); letter-spacing: -.01em; }
      .lede { color: var(--muted); margin: 0 0 1.25rem; font-size: .95rem; }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; }
      h2 { font-size: 1.05rem; margin: 1.75rem 0 .25rem; color: var(--ink-strong); }
      .section-desc { color: var(--muted); font-size: .9rem; margin: 0 0 .75rem; white-space: pre-line; }
      .field { display: flex; flex-direction: column; gap: .45rem; margin: 1.1rem 0; }
      .field[hidden] { display: none; }
      .label { font-weight: 600; color: var(--ink-strong); font-size: .95rem; }
      .label .req { color: var(--danger); }
      .help { color: var(--muted); font-size: .85rem; white-space: pre-line; }
      input.in, textarea.in, select.in {
        font: inherit; font-size: 1rem; color: var(--ink-strong); background: var(--card); border: 1px solid var(--border);
        border-radius: 10px; padding: .65rem .8rem; width: 100%; min-height: 44px;
      }
      input.in:focus, textarea.in:focus, select.in:focus { outline: 2px solid var(--border-focus); outline-offset: 1px; }
      .row { display: flex; gap: .5rem; align-items: center; }
      .unit { color: var(--muted); white-space: nowrap; }
      .options { display: flex; flex-direction: column; gap: .4rem; }
      button.opt {
        display: flex; align-items: center; gap: .65rem; text-align: left; width: 100%; min-height: 44px;
        font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: .6rem .8rem; cursor: pointer;
      }
      button.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink-strong); }
      .mark { width: 1rem; height: 1rem; border: 1.5px solid var(--faint); border-radius: 50%; flex: none; display: grid; place-items: center; }
      .mark.box { border-radius: 4px; }
      button.opt[aria-pressed="true"] .mark { border-color: var(--accent); }
      button.opt[aria-pressed="true"] .mark::after { content: ""; width: .5rem; height: .5rem; background: var(--accent); border-radius: inherit; }
      .pills { display: flex; flex-wrap: wrap; gap: .4rem; }
      button.pill {
        min-width: 44px; min-height: 44px; font: inherit; border: 1px solid var(--border); background: var(--card); color: var(--ink);
        border-radius: 10px; padding: .5rem .9rem; cursor: pointer;
      }
      button.pill[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
      .ends { display: flex; justify-content: space-between; color: var(--muted); font-size: .8rem; max-width: 30rem; }
      .reading { white-space: pre-line; background: var(--field); border-radius: 10px; padding: .85rem 1rem; line-height: 1.55; }
      .worked { display: inline-flex; gap: .4rem; align-items: baseline; background: var(--field); border-radius: 10px; padding: .45rem .8rem; width: fit-content; }
      .worked b { font-size: 1.15rem; color: var(--ink-strong); }
      .band { font-size: .8rem; background: var(--accent-soft); border-radius: 6px; padding: .1rem .45rem; }
      .consent { border: 1px solid var(--border); border-radius: 10px; padding: .85rem 1rem; display: flex; flex-direction: column; gap: .75rem; }
      .consent p { margin: 0; white-space: pre-line; line-height: 1.55; }
      table.rows { width: 100%; border-collapse: separate; border-spacing: 0 .35rem; }
      table.rows th { text-align: left; font-weight: 500; color: var(--muted); font-size: .8rem; padding: 0 .25rem; }
      table.rows td { padding: 0 .25rem; }
      .scroll { overflow-x: auto; }
      .scroll table { min-width: 28rem; }
      .pad { position: relative; height: 170px; border: 1px solid var(--border-focus); border-radius: 12px; overflow: hidden; background: #fff; touch-action: none; }
      .pad canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
      .pad .line { position: absolute; left: 1rem; right: 1rem; bottom: .8rem; border-top: 1px solid #c9ccd1; padding-top: .25rem; font-size: .8rem; color: #8a8f98; pointer-events: none; }
      .missing { color: var(--danger); font-size: .85rem; }
      .stop { background: var(--danger-bg); color: var(--danger); border-radius: 10px; padding: .6rem .8rem; font-size: .9rem; }
      .notice { background: var(--danger-bg); color: var(--danger); border-radius: 10px; padding: .75rem 1rem; margin: 1rem 0; }
      .ok { background: var(--success-bg); color: var(--success-ink); border-radius: 10px; padding: .75rem 1rem; }
      button.primary, button.secondary, button.ghost {
        font: inherit; font-weight: 600; border-radius: 10px; padding: .75rem 1.1rem; cursor: pointer; min-height: 44px;
      }
      button.primary { background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); }
      button.secondary { background: var(--card); color: var(--ink-strong); border: 1px solid var(--border); }
      button.ghost { background: transparent; color: var(--muted); border: none; padding-left: 0; }
      button:disabled { opacity: .5; cursor: default; }
      a.action {
        display: flex; gap: .75rem; align-items: center; min-height: 44px; padding: .7rem 1rem; border: 1px solid var(--border);
        border-radius: 10px; background: var(--card); color: var(--ink-strong); text-decoration: none; font-weight: 600;
      }
      a.action.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); justify-content: center; margin-top: 1.5rem; }
      .actions {
        position: sticky; bottom: 0; background: var(--bg); padding: .85rem 0; margin-top: 1.5rem;
        display: flex; gap: .6rem; justify-content: flex-end; border-top: 1px solid var(--border); flex-wrap: wrap;
      }
      .code { letter-spacing: .4em; font-size: 1.4rem; text-align: center; max-width: 14rem; }
      .stack { display: flex; flex-direction: column; gap: .85rem; }
      .muted { color: var(--muted); }
    </style>
  </head>
  <body>
    <main class="shell" id="app" aria-live="polite">
      <div class="brand">
        {% if branding.logo %}<img src="{{ branding.logo }}" alt="" />{% endif %}
        <span>{{ branding.title }}</span>
      </div>
      <p class="muted" id="loading">…</p>
    </main>
    <script>
      window.BOOT = {{ boot | tojson }};
      window.CSRF = {{ csrf_token | tojson }};
      // the engine names its words through `__`: this page's dictionary answers
      window.__ = (message, args) => {
        let text = (window.WORDS && window.WORDS[message]) || message;
        (args || []).forEach((arg, i) => (text = text.replace("{" + i + "}", arg)));
        return text;
      };
    </script>
    <script type="module">
      import { evaluate, sectionsOf, fieldsOfSection, fieldsOf } from "/assets/crm/js/moduli_engine.js?v={{ engine_version }}";

      const IT = {
        "Forms to fill": "Moduli da compilare",
        "Forms for {0}": "Moduli per {0}",
        "To open them we send a code to {0}.": "Per aprirli ti mandiamo un codice a {0}.",
        "To open them we send a code to the address the link came to.": "Per aprirli ti mandiamo un codice all'indirizzo a cui è arrivato il link.",
        "Send me the code": "Mandami il codice",
        "The code": "Il codice",
        "Open": "Apri",
        "Send it again": "Mandalo di nuovo",
        "Code sent to {0}.": "Codice mandato a {0}.",
        "Save and finish later": "Salva e finisci dopo",
        "Sign": "Firma",
        "Finish": "Ho finito",
        "Back to the forms": "Torna ai moduli",
        "Saved: you can finish it later from the same link.": "Salvato: puoi finirlo dopo, dallo stesso link.",
        "Still to answer: {0}": "Da rispondere ancora: {0}",
        "This is required": "Obbligatorio",
        "To go on, this has to be accepted": "Per andare avanti va accettato",
        "Stop here and tell the operator": "Fermati qui e avvisa l'operatore",
        "Yes": "Sì", "No": "No",
        "I agree": "Acconsento", "I do not agree": "Non acconsento",
        "Clear": "Cancella",
        "Sign here": "Firma qui",
        "Left": "Sinistra", "Right": "Destra",
        "Add a row": "Aggiungi una riga", "Remove": "Togli",
        "To fill": "Da compilare",
        "Signed": "Firmato",
        "Done: to sign at the desk": "Fatto: si firma al banco",
        "Expired": "Scaduto",
        "Signed at the desk, when you come.": "Si firma al banco, quando vieni.",
        "You fill it here; it is signed at the desk.": "Lo compili qui; si firma al banco.",
        "Thank you, {0}.": "Grazie, {0}.",
        "Thank you.": "Grazie.",
        "Everything is done.": "È tutto fatto.",
        "The forms to sign at the desk wait for you there.": "I moduli da firmare al banco ti aspettano lì.",
        "Download your copy": "Scarica la tua copia",
        "Your copies": "Le tue copie",
        "Please hand the tablet back to the desk.": "Riconsegna il tablet in segreteria, per favore.",
        "Staff login": "Accesso dello staff",
        "Bring it to the visit, or send it to the centre.": "Portalo alla visita, o mandalo al centro.",
        "Something went wrong: try again.": "Qualcosa non è andato: riprova.",
        "Nothing is left to fill here.": "Qui non c'è più niente da compilare.",
        "Back to your area": "Torna alla tua area",
      };
      window.WORDS = (window.BOOT.lang || "it").startsWith("it") ? IT : {};
      const t = window.__;
      const token = window.BOOT.token;
      const app = document.getElementById("app");
      const brand = app.querySelector(".brand").outerHTML;
      const KEY = "modulo:" + token;
      const fromArea = new URLSearchParams(window.location.search).get("from") === "area";
      let session = null;
      try { session = sessionStorage.getItem(KEY); } catch (e) { session = null; }
      let view = null;

      function keep(value) {
        session = value;
        try { value ? sessionStorage.setItem(KEY, value) : sessionStorage.removeItem(KEY); } catch (e) { /* the page still works */ }
      }

      function h(tag, attrs, ...children) {
        const el = document.createElement(tag);
        for (const [key, value] of Object.entries(attrs || {})) {
          if (value === null || value === undefined || value === false) continue;
          if (key.startsWith("on")) el.addEventListener(key.slice(2), value);
          else if (key === "class") el.className = value;
          else el.setAttribute(key, value === true ? "" : value);
        }
        for (const child of children.flat()) {
          if (child === null || child === undefined || child === false) continue;
          el.append(child instanceof Node ? child : document.createTextNode(String(child)));
        }
        return el;
      }

      function messageOf(data) {
        try {
          const list = JSON.parse(data._server_messages || "[]");
          if (list.length) return JSON.parse(list[0]).message.replace(/<[^>]+>/g, " ").trim();
        } catch (e) { /* the plain message below */ }
        return t("Something went wrong: try again.");
      }

      class Refused extends Error {}

      async function api(method, args) {
        const response = await fetch("/api/method/crm.moduli.richieste." + method, {
          method: "POST",
          headers: { Accept: "application/json", "Content-Type": "application/x-www-form-urlencoded", "X-Frappe-CSRF-Token": window.CSRF || "" },
          body: new URLSearchParams({ token, ...(session ? { session } : {}), ...(args || {}) }),
        });
        const data = await response.json().catch(() => ({}));
        if (response.status === 403) throw new Refused(messageOf(data));
        if (!response.ok) throw new Error(messageOf(data));
        return data.message;
      }

      function screen(...children) {
        app.innerHTML = brand;
        app.append(...children.filter((child) => child !== null && child !== undefined && child !== false));
        window.scrollTo(0, 0);
      }

      function fail(error) {
        screen(h("div", { class: "notice", role: "alert" }, error.message || String(error)));
      }

      // the session went (expired, or the tablet was handed back): start again
      function lost(error) {
        keep(null);
        if (view && view.needs_code) return askCode(error.message);
        fail(error);
      }

      // --- the link and the code ---------------------------------------------

      async function start() {
        try { view = await api("open_request"); } catch (error) { return fail(error); }
        if (view.session) keep(view.session);
        if (view.needs_code && !session) return askCode();
        showForms();
      }

      function askCode(problem = "", sentTo = null) {
        const input = h("input", { class: "in code", inputmode: "numeric", autocomplete: "one-time-code", maxlength: "6", "aria-label": t("The code") });
        const error = h("p", { class: "missing", role: "alert" }, problem);
        const open = async () => {
          error.textContent = "";
          try {
            const result = await api("verify_code", { code: input.value.trim() });
            keep(result.session);
            showForms();
          } catch (e) { error.textContent = e.message; }
        };
        const send = async (button) => {
          button.disabled = true;
          try {
            const result = await api("send_code");
            askCode("", result.sent_to);
          } catch (e) { error.textContent = e.message; button.disabled = false; }
        };
        const sent = sentTo !== null;
        screen(
          h("h1", {}, t("Forms to fill")),
          h("div", { class: "card stack" },
            h("p", { style: "margin:0" }, sent
              ? t("Code sent to {0}.", [sentTo])
              : view.sent_to ? t("To open them we send a code to {0}.", [view.sent_to]) : t("To open them we send a code to the address the link came to.")),
            sent
              ? h("div", { class: "stack" },
                  input,
                  h("div", { class: "row", style: "flex-wrap:wrap" },
                    h("button", { class: "primary", onclick: open }, t("Open")),
                    h("button", { class: "ghost", onclick: (e) => send(e.currentTarget) }, t("Send it again"))))
              : h("button", { class: "primary", onclick: (e) => send(e.currentTarget) }, t("Send me the code")),
            error));
        if (sent) {
          input.focus();
          input.addEventListener("keydown", (e) => e.key === "Enter" && open());
        }
      }

      // --- the forms of the link ---------------------------------------------

      let list = null;
      const OPEN = ["Sent", "Opened"];
      const STATUS = { Filled: "Done: to sign at the desk", Signed: "Signed", Expired: "Expired" };

      async function showForms() {
        try { list = await api("get_request_forms"); } catch (error) {
          return error instanceof Refused ? lost(error) : fail(error);
        }
        const open = list.forms.filter((form) => OPEN.includes(form.status));
        if (!open.length) return done();
        // one form to fill: straight to it
        if (list.forms.length === 1) return openForm(open[0].id);
        screen(
          h("h1", {}, list.for_whom ? t("Forms for {0}", [list.for_whom]) : t("Forms to fill")),
          h("div", { class: "options" },
            list.forms.map((form) => {
              const waiting = OPEN.includes(form.status);
              return h("button", { class: "opt", type: "button", disabled: !waiting, onclick: () => openForm(form.id) },
                h("span", { style: "flex:1" }, form.title,
                  form.sign_at_desk && waiting ? h("span", { class: "help", style: "display:block" }, t("You fill it here; it is signed at the desk.")) : null),
                h("span", { class: "band" }, waiting ? t("To fill") : t(STATUS[form.status] || form.status)));
            })));
      }

      function done() {
        const name = list && list.person;
        const thanks = name ? t("Thank you, {0}.", [name]) : t("Thank you.");
        const atDesk = list && list.forms.some((form) => form.status === "Filled");
        if (view.channel === "Tablet") {
          keep(null);
          return screen(h("h1", {}, thanks), h("p", { class: "lede" }, t("Please hand the tablet back to the desk.")),
            h("a", { class: "action", href: "/login?redirect-to=/crm" }, t("Staff login")));
        }
        const copies = (list ? list.forms : []).filter((form) => form.status === "Signed");
        screen(
          h("h1", {}, thanks),
          h("p", { class: "lede" }, t("Everything is done.") + (atDesk ? " " + t("The forms to sign at the desk wait for you there.") : "")),
          copies.length ? h("h2", {}, t("Your copies")) : null,
          h("div", { class: "stack" }, copies.map((form) => copyLink(form.id, form.title))),
          // opened from the patient area: back where the person came from
          fromArea ? h("a", { class: "action primary", href: "/area" }, t("Back to your area")) : null);
      }

      function copyLink(id, title) {
        const query = new URLSearchParams({ token, request: id, session: session || "" });
        return h("a", { class: "action", href: "/api/method/crm.moduli.richieste.signed_copy?" + query.toString() },
          h("span", { style: "flex:1;min-width:0" }, title), h("span", { class: "muted", style: "flex:none" }, t("Download your copy")));
      }

      // --- one form ------------------------------------------------------------

      let current = null;
      let schema = null;
      let values = {};
      let tried = false;
      let parts = {};

      async function openForm(id) {
        let data;
        try { data = await api("get_request_form", { request: id }); } catch (error) {
          return error instanceof Refused ? lost(error) : fail(error);
        }
        current = data;
        schema = data.schema;
        values = { ...(data.answers || {}) };
        tried = false;
        parts = {};
        const body = h("div", {});
        for (const section of sectionsOf(schema)) {
          const box = h("section", { "data-section": section.id },
            section.title ? h("h2", {}, section.title) : null,
            section.description ? h("p", { class: "section-desc" }, section.description) : null);
          for (const field of fieldsOfSection(section)) box.append(renderField(field));
          parts["§" + section.id] = box;
          body.append(box);
        }
        const note = h("p", { class: "missing", role: "alert" });
        parts.note = note;
        const several = list && list.forms.length > 1;
        screen(
          several ? h("button", { class: "ghost", type: "button", onclick: showForms }, "← " + t("Back to the forms")) : null,
          h("h1", {}, data.title),
          data.sign_at_desk ? h("p", { class: "lede" }, t("You fill it here; it is signed at the desk.")) : null,
          body,
          note,
          h("div", { class: "actions" },
            view.channel === "Link" ? h("button", { class: "secondary", onclick: save }, t("Save and finish later")) : null,
            h("button", { class: "primary", onclick: (e) => submit(e.currentTarget) }, data.sign_at_desk ? t("Finish") : t("Sign"))));
        refresh();
      }

      function set(key, value) {
        values[key] = value;
        refresh();
      }

      function renderField(field) {
        const wrap = h("div", { class: "field", "data-field": field.id });
        if (field.type === "paragraph") {
          wrap.append(h("div", { class: "reading" }, field.text || ""));
        } else {
          wrap.append(h("div", { class: "label" }, field.label || "", h("span", { class: "req" })));
          if (field.description) wrap.append(h("div", { class: "help" }, field.description));
          wrap.append(control(field));
        }
        const missing = h("div", { class: "missing", hidden: true });
        const stop = h("div", { class: "stop", role: "alert", hidden: true });
        wrap.append(missing, stop);
        parts[field.id] = { wrap, missing, stop, worked: wrap.querySelector("[data-worked]") };
        return wrap;
      }

      function pressed(button, on) { button.setAttribute("aria-pressed", on ? "true" : "false"); }

      function control(field) {
        const value = values[field.id];
        switch (field.type) {
          case "text": {
            const el = field.multiline
              ? h("textarea", { class: "in", rows: "4" }, value || "")
              : h("input", { class: "in", value: value || "" });
            el.addEventListener("input", () => set(field.id, el.value));
            const phrases = (field.phrases || []).map((phrase) => h("button", { class: "pill", type: "button", onclick: () => {
              el.value = el.value.trim() ? el.value.trimEnd() + (field.multiline ? "\n" : " ") + phrase : phrase;
              set(field.id, el.value);
            } }, phrase));
            return h("div", { class: "stack" }, el, phrases.length ? h("div", { class: "pills" }, phrases) : null);
          }
          case "number": {
            const el = h("input", { class: "in", inputmode: "decimal", value: value ?? "", style: "max-width:12rem" });
            el.addEventListener("input", () => set(field.id, el.value));
            return h("div", { class: "row" }, el, field.unit ? h("span", { class: "unit" }, field.unit) : null);
          }
          case "date": {
            const el = h("input", { class: "in", type: "date", value: value || "", style: "max-width:14rem" });
            el.addEventListener("change", () => set(field.id, el.value || null));
            return el;
          }
          case "choice": {
            const labels = (field.options || []).map((o) => o && o.label).filter(Boolean);
            if (field.display === "dropdown" && !field.multiple) {
              const el = h("select", { class: "in" }, h("option", { value: "" }, ""), labels.map((l) => h("option", { value: l, selected: value === l }, l)));
              el.addEventListener("change", () => set(field.id, el.value || null));
              return el;
            }
            const buttons = labels.map((label) => {
              const on = field.multiple ? (value || []).includes(label) : value === label;
              const button = h("button", { class: "opt", type: "button", "aria-pressed": on ? "true" : "false" },
                h("span", { class: "mark" + (field.multiple ? " box" : "") }), label);
              button.addEventListener("click", () => {
                if (field.multiple) {
                  const now = new Set(values[field.id] || []);
                  now.has(label) ? now.delete(label) : now.add(label);
                  set(field.id, labels.filter((l) => now.has(l)));
                } else {
                  set(field.id, values[field.id] === label ? null : label);
                }
                buttons.forEach((b, i) => pressed(b, field.multiple ? (values[field.id] || []).includes(labels[i]) : values[field.id] === labels[i]));
              });
              return button;
            });
            return h("div", { class: "options" }, buttons);
          }
          case "yesno":
          case "consent": {
            const consent = field.type === "consent";
            const choices = consent && field.must_accept
              ? [[true, t("I agree")]]
              : [[true, consent ? t("I agree") : t("Yes")], [false, consent ? t("I do not agree") : t("No")]];
            const buttons = choices.map(([answer, label]) => {
              const button = h("button", { class: "pill", type: "button", "aria-pressed": values[field.id] === answer ? "true" : "false" }, label);
              button.addEventListener("click", () => {
                set(field.id, values[field.id] === answer ? null : answer);
                buttons.forEach((b, i) => pressed(b, values[field.id] === choices[i][0]));
              });
              return button;
            });
            const pills = h("div", { class: "pills" }, buttons);
            return consent ? h("div", { class: "consent" }, h("p", {}, field.text || ""), pills) : pills;
          }
          case "scale": {
            const least = Number(field.min ?? 0);
            const most = Number(field.max ?? 10);
            const steps = [];
            for (let n = least; n <= most && steps.length <= 101; n++) steps.push(n);
            const buttons = steps.map((n) => {
              const button = h("button", { class: "pill", type: "button", "aria-pressed": values[field.id] === n ? "true" : "false" }, String(n));
              button.addEventListener("click", () => {
                set(field.id, values[field.id] === n ? null : n);
                buttons.forEach((b, i) => pressed(b, values[field.id] === steps[i]));
              });
              return button;
            });
            return h("div", { class: "stack" }, h("div", { class: "pills" }, buttons),
              field.min_label || field.max_label ? h("div", { class: "ends" }, h("span", {}, field.min_label || ""), h("span", {}, field.max_label || "")) : null);
          }
          case "sides": {
            const now = { ...(value || {}) };
            const side = (key, label) => {
              const el = h("input", { class: "in", inputmode: field.input === "text" ? "text" : "decimal", value: now[key] ?? "" });
              el.addEventListener("input", () => { now[key] = el.value; set(field.id, { ...now }); });
              return h("label", { class: "stack", style: "gap:.3rem;flex:1;min-width:0" }, h("span", { class: "help" }, label),
                h("span", { class: "row" }, el, field.unit ? h("span", { class: "unit" }, field.unit) : null));
            };
            return h("div", { class: "row" }, side("left", t("Left")), side("right", t("Right")));
          }
          case "table": return tableControl(field);
          case "calc":
          case "score":
            return h("div", { class: "worked" }, h("b", { "data-worked": "" }, "—"), field.unit ? h("span", { class: "unit" }, field.unit) : null, h("span", { class: "band", hidden: true }));
          case "signature":
            return current.sign_at_desk ? h("p", { class: "help" }, t("Signed at the desk, when you come.")) : padControl(field);
          case "attachment": return h("p", { class: "help" }, t("Bring it to the visit, or send it to the centre."));
          default: return h("span", {});
        }
      }

      function tableControl(field) {
        const columns = (field.columns || []).filter(Boolean);
        const rows = Array.isArray(values[field.id]) ? values[field.id].map((r) => ({ ...r })) : [];
        const holder = h("div", { class: "stack" });
        const copy = () => rows.map((r) => ({ ...r }));
        const draw = () => {
          holder.innerHTML = "";
          if (rows.length) {
            const table = h("table", { class: "rows" },
              h("tr", {}, columns.map((c) => h("th", {}, c.label)), h("th", {})),
              rows.map((row, index) => h("tr", {},
                columns.map((c) => {
                  const el = h("input", { class: "in", type: c.type === "date" ? "date" : "text", inputmode: c.type === "number" ? "decimal" : null, value: row[c.id] ?? "" });
                  el.addEventListener("input", () => { row[c.id] = el.value; set(field.id, copy()); });
                  return h("td", {}, el);
                }),
                h("td", {}, h("button", { class: "ghost", type: "button", onclick: () => { rows.splice(index, 1); set(field.id, copy()); draw(); } }, t("Remove"))))));
            holder.append(h("div", { class: "scroll" }, table));
          }
          holder.append(h("button", { class: "secondary", type: "button", onclick: () => { rows.push({}); draw(); } }, t("Add a row")));
        };
        draw();
        return holder;
      }

      // the stroke only: no pressure, no timing (they would be biometric data)
      function padControl(field) {
        const canvas = h("canvas", { "aria-label": field.label || t("Sign here") });
        const pad = h("div", { class: "pad" }, canvas, h("div", { class: "line" }, field.label || t("Sign here")));
        let strokes = 0;
        let drawing = null;
        const pen = () => {
          const c = canvas.getContext("2d");
          c.lineCap = "round"; c.lineJoin = "round"; c.strokeStyle = "#1f2328"; c.fillStyle = "#1f2328";
          c.lineWidth = 2.2 * (window.devicePixelRatio || 1);
          return c;
        };
        const point = (e) => {
          const r = canvas.getBoundingClientRect();
          const s = window.devicePixelRatio || 1;
          return [(e.clientX - r.left) * s, (e.clientY - r.top) * s];
        };
        const clear = () => {
          const s = window.devicePixelRatio || 1;
          canvas.width = Math.round(pad.clientWidth * s);
          canvas.height = Math.round(pad.clientHeight * s);
          strokes = 0;
          set(field.id, null);
        };
        canvas.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
          drawing = [point(e)];
          strokes++;
          const c = pen(); const [x, y] = drawing[0];
          c.beginPath(); c.arc(x, y, c.lineWidth / 2, 0, Math.PI * 2); c.fill();
        });
        canvas.addEventListener("pointermove", (e) => {
          if (!drawing) return;
          e.preventDefault();
          drawing.push(point(e));
          const n = drawing.length;
          if (n < 3) return;
          const [x0, y0] = drawing[n - 3], [x1, y1] = drawing[n - 2], [x2, y2] = drawing[n - 1];
          const c = pen();
          c.beginPath(); c.moveTo((x0 + x1) / 2, (y0 + y1) / 2); c.quadraticCurveTo(x1, y1, (x1 + x2) / 2, (y1 + y2) / 2); c.stroke();
        });
        const end = () => {
          if (!drawing) return;
          drawing = null;
          set(field.id, strokes ? canvas.toDataURL("image/png") : null);
        };
        ["pointerup", "pointercancel", "pointerleave"].forEach((kind) => canvas.addEventListener(kind, end));
        requestAnimationFrame(clear);
        return h("div", { class: "stack", style: "gap:.3rem" }, pad, h("button", { class: "ghost", type: "button", onclick: clear }, t("Clear")));
      }

      const signatureKeys = () => new Set(fieldsOf(schema).filter((f) => f.type === "signature").map((f) => f.id));

      // the same evaluation the server makes when the form is signed
      function refresh() {
        const state = evaluate(schema, values);
        const skip = current.sign_at_desk ? signatureKeys() : new Set();
        const required = new Set(state.required);
        const missing = new Set(state.missing.filter((key) => !skip.has(key)));
        const stops = new Map(state.stops.map((s) => [s.field, s.message]));
        for (const section of sectionsOf(schema)) parts["§" + section.id].hidden = !state.sections[section.id];
        for (const field of fieldsOf(schema)) {
          const part = parts[field.id];
          if (!part) continue;
          part.wrap.hidden = !state.visible[field.id];
          const star = part.wrap.querySelector(".req");
          if (star) star.textContent = required.has(field.id) && !skip.has(field.id) ? " *" : "";
          part.missing.hidden = !(tried && missing.has(field.id));
          part.missing.textContent = field.must_accept ? t("To go on, this has to be accepted") : t("This is required");
          part.stop.hidden = !stops.has(field.id);
          part.stop.textContent = stops.get(field.id) || t("Stop here and tell the operator");
          if (part.worked) {
            const worked = state.values[field.id];
            part.worked.textContent = worked === null || worked === undefined ? "—" : String(worked);
            const band = part.wrap.querySelector(".band");
            if (band) { band.hidden = !state.bands[field.id]; band.textContent = state.bands[field.id] || ""; }
          }
        }
        return { ...state, missing: [...missing] };
      }

      function answersOnly() {
        const skip = signatureKeys();
        return Object.fromEntries(Object.entries(values).filter(([key]) => !skip.has(key)));
      }

      async function save(event) {
        const button = event.currentTarget;
        button.disabled = true;
        try {
          await api("save_request_answers", { request: current.id, answers: JSON.stringify(answersOnly()) });
          parts.note.className = "ok";
          parts.note.textContent = t("Saved: you can finish it later from the same link.");
        } catch (error) {
          if (error instanceof Refused) return lost(error);
          parts.note.className = "missing";
          parts.note.textContent = error.message;
        } finally { button.disabled = false; }
      }

      async function submit(button) {
        tried = true;
        const state = refresh();
        parts.note.className = "missing";
        if (state.missing.length) {
          const labels = state.missing.map((key) => (fieldsOf(schema).find((f) => f.id === key) || {}).label || key);
          parts.note.textContent = t("Still to answer: {0}", [labels.join(", ")]);
          const first = document.querySelector(`[data-field="${state.missing[0]}"]`);
          if (first) first.scrollIntoView({ behavior: "smooth", block: "center" });
          return;
        }
        button.disabled = true;
        try {
          let result;
          if (current.sign_at_desk) {
            result = await api("finish_request", { request: current.id, answers: JSON.stringify(answersOnly()) });
          } else {
            const keys = signatureKeys();
            const strokes = Object.fromEntries(Object.entries(values).filter(([key, value]) => keys.has(key) && typeof value === "string"));
            result = await api("sign_request", { request: current.id, answers: JSON.stringify(answersOnly()), signatures: JSON.stringify(strokes) });
          }
          // the tablet's session ends with its last form: nothing more to ask it
          if (result.done && view.channel === "Tablet") return done();
          showForms();
        } catch (error) {
          if (error instanceof Refused) return lost(error);
          parts.note.textContent = error.message;
          button.disabled = false;
        }
      }

      start();
    </script>
  </body>
</html>

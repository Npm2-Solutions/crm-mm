<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    {{robots}}
    <link rel="canonical" href="{{canonical}}" />
    <meta name="theme-color" content="#F4F7F6" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/font/inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/css/sito.css?v={{version}}" />
    <script>
      document.documentElement.classList.add("js")
    </script>
    <script src="/js/sito.js?v={{version}}" defer></script>
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:site_name" content="DottorCloud" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{canonical}}" />
    <meta property="og:image" content="{{origin}}/img/condivisione.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DottorCloud, il gestionale per il tuo centro medico" />
    <meta name="twitter:card" content="summary_large_image" />
    {{head}}
  </head>
  <body>
    <a class="skip" href="#contenuto">Vai al contenuto</a>
    {{> header}}
    <main id="contenuto">
      {{content}}
    </main>
    {{> footer}}
  </body>
</html>
